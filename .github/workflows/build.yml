name: Build and test

# Builds the app and runs the unit tests on every push to main and on every pull
# request, so a broken build shows up on GitHub within minutes instead of the next
# time someone happens to compile it locally.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels an older run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The cheapest possible check, and the one that would have caught the unresolved
      # merge conflicts that once landed on main: no need to wait for Gradle to say so.
      - name: Refuse unresolved merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- '*.kt' '*.kts' '*.xml' '*.gradle'; then
            echo "::error::Unresolved merge conflict markers found in the files listed above."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle's downloads between runs, so only the first run is slow.
      - uses: gradle/actions/setup-gradle@v4

      # Belt and braces: the script is executable in the repo now, but a checkout on some
      # systems can lose that bit, and this step costs nothing.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Kept even when the tests fail, because that is when you want to read them.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # A ready-made debug build, downloadable from the run's page: installable on an
      # emulator or any phone without setting up Android Studio.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: resonant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
