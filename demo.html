<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resonant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="sr-live" role="status" aria-live="polite" aria-atomic="true" class="sr-only">
    Resonant ready. Tap the orb or press Space to begin.
  </div>

  <a href="#main-controls" class="skip-link">Skip to controls</a>

  <main id="voice-app" role="application" aria-label="Resonant voice learning assistant" data-state="idle">

    <span class="wordmark" aria-hidden="true">Resonant</span>

    <button id="btn-settings" class="settings-btn" aria-label="Open settings" aria-haspopup="dialog">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>

    <!-- Orb — the whole interface -->
    <section class="orb-stage" aria-label="Voice activity">
      <button id="btn-orb" class="orb-btn" aria-label="Start listening" aria-pressed="false">
        <div class="orb-ring orb-ring--outer" aria-hidden="true"></div>
        <div class="orb-ring orb-ring--inner" aria-hidden="true"></div>
        <div class="orb-circle" aria-hidden="true"></div>
      </button>
      <p id="state-label" class="state-label" aria-hidden="true"></p>
    </section>

    <!-- Chat transcript -->
    <section id="chat-log" class="chat-log" aria-label="Conversation" aria-live="polite"></section>

    <!-- Bottom input -->
    <nav id="main-controls" class="bottom" aria-label="Controls">
      <form id="text-form" class="text-row" autocomplete="off">
        <input type="text" id="text-input" class="text-input" placeholder="Type a message…" aria-label="Type a message" />
        <button type="submit" id="btn-send" class="send-btn" aria-label="Send message">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </form>
      <button id="btn-end" class="end-btn" aria-label="End session" style="display:none">End</button>
    </nav>

    <!-- Settings dialog -->
    <div id="settings-panel" class="settings-panel" role="dialog" aria-modal="true" aria-label="Settings" aria-hidden="true" tabindex="-1">
      <div class="settings-inner">
        <h2 class="settings-title">Settings</h2>
        <label class="setting-row">
          <span>High contrast</span>
          <input type="checkbox" id="high-contrast" aria-label="Enable high contrast mode" />
        </label>
        <label class="setting-row">
          <span>Reduce motion</span>
          <input type="checkbox" id="reduce-motion" aria-label="Reduce animations" />
        </label>
        <button id="settings-close" class="settings-done">Done</button>
      </div>
    </div>

  </main>

  <aside class="key-hints" aria-label="Keyboard shortcuts">
    <span>Space · listen</span>
    <span>Esc · end</span>
    <span>S · settings</span>
  </aside>

  <script src="app.js"></script>
</body>
</html>
